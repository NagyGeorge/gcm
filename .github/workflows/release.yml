name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows GUI
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run tests
        run: |
          python -m ruff check src tests
          python -m pytest

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/GCMReport.spec

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Compress-Archive -Path dist/GCMReport.exe -DestinationPath release/GCMReport-Windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCMReport-Windows
          path: release/GCMReport-Windows.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/GCMReport-Windows.zip
